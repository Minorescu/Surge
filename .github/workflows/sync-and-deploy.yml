name: Daily upstream sync and conditional deploy

on:
  schedule:
    # Main check: 06:30 Asia/Shanghai = 22:30 UTC (previous day)
    - cron: '30 22 * * *'
    # Fallback check: 08:00 Asia/Shanghai = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ruleset-dual-sites
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - name: Check upstream state via public API
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_sha=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/SukkaLab/ruleset.skk.moe/git/ref/heads/master \
            | jq -er '.object.sha')
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          state_json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.upstream-sync-state?ref=master" 2>/dev/null || true)
          stored_sha=$(printf '%s' "$state_json" | jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null | tr -d '\r\n' || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$stored_sha" = "$upstream_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  sync-deploy-verify:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge detected upstream revision
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SukkaLab/ruleset.skk.moe.git
          git fetch upstream master --tags --force
          git merge "${{ needs.check-upstream.outputs.upstream_sha }}" --no-edit
          git push origin master --follow-tags

      - name: Prepare Cloudflare Pages main site
        run: |
          set -euo pipefail
          mkdir /tmp/cloudflare-site
          rsync -a --exclude='.git' --exclude='CNAME' ./ /tmp/cloudflare-site/
          python3 .github/customize.py /tmp/cloudflare-site/index.html https://ruleset.ssn.moe/
          touch /tmp/cloudflare-site/.nojekyll

      - name: Prepare GitHub Pages mirror
        run: |
          set -euo pipefail
          mkdir /tmp/github-site
          rsync -a --exclude='.git' --exclude='CNAME' ./ /tmp/github-site/
          python3 .github/customize.py /tmp/github-site/index.html https://ruleset-mirror.ssn.moe/
          touch /tmp/github-site/.nojekyll

      - name: Deploy Cloudflare Pages main site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/cloudflare-site --project-name=ruleset-ssn-moe --branch=master

      - name: Configure GitHub Pages mirror
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages mirror artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/github-site

      - name: Deploy GitHub Pages mirror
        uses: actions/deploy-pages@v4

      - name: Verify both sites after deployment
        run: |
          set -euo pipefail
          cp deploy-check.txt /tmp/expected.txt
          for site in https://ruleset.ssn.moe https://ruleset-mirror.ssn.moe; do
            ok=false
            for attempt in 1 2 3 4 5 6; do
              suffix="verify-${{ github.run_id }}-$attempt"
              if curl -fLsS --connect-timeout 10 --max-time 30 "$site/?$suffix" -o /tmp/site.html \
                && grep -q 'Minorescu Ruleset Server' /tmp/site.html \
                && grep -q 'Made by' /tmp/site.html \
                && grep -q 'Source @ GitHub' /tmp/site.html \
                && grep -q 'Fork' /tmp/site.html \
                && grep -q 'Sukka' /tmp/site.html \
                && grep -q 'Licensed under' /tmp/site.html \
                && curl -fLsS --connect-timeout 10 --max-time 30 "$site/deploy-check.txt?$suffix" -o /tmp/site.txt \
                && cmp -s /tmp/site.txt /tmp/expected.txt; then
                ok=true
                break
              fi
              sleep 10
            done
            [ "$ok" = true ] || { echo "Post-deploy verification failed: $site"; exit 1; }
          done

      - name: Record successful upstream synchronization
        run: |
          set -euo pipefail
          printf '%s\n' '${{ needs.check-upstream.outputs.upstream_sha }}' > .upstream-sync-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-sync-state
          git commit -m "chore: record successful upstream sync"
          git push origin master
